services:
  - type: web
    name: barbershopik-bot
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node bot-runner.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production